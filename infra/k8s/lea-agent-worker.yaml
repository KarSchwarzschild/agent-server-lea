# lea-agent Temporal Worker。它不接收客户端流量，只从 Temporal Task Queue 拉取 Agent Run。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lea-agent-worker
  labels: {app: lea-agent-worker}
spec:
  replicas: 2
  selector:
    matchLabels: {app: lea-agent-worker}
  template:
    metadata:
      labels: {app: lea-agent-worker}
    spec:
      # 私有 registry 必需。用
      #   kubectl create secret docker-registry lea-registry \
      #       --docker-server=<registry> --docker-username=<u> --docker-password=<p>
      # 创建；名字对不上的表现是 Pod 卡在 ImagePullBackOff。
      imagePullSecrets:
        - name: lea-registry
      terminationGracePeriodSeconds: 200
      containers:
        - name: lea-agent-worker
          # ⚠️ 占位符。部署前替换成 registry 地址 + 不可变 tag，例如
          #     swr.<region>.myhuaweicloud.com/<组织>/lea-agent:<commit-sha>
          # **用 commit sha，不要用 latest** —— 用 latest 就回到了"线上跑的是哪个
          # commit 查不出来"那个问题。CI 每次构建都会打 sha tag，见 .gitlab-ci.yml。
          image: lea-agent:REPLACE_ME
          imagePullPolicy: Always
          command: ["/usr/local/bin/lea-agent-worker"]
          envFrom:
            - configMapRef: {name: lea-common}
            - secretRef: {name: lea-secrets}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
