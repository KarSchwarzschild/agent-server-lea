[project]
name = "lea-platform"
version = "0.1.0"
description = "终身教育AI Agent平台"
requires-python = ">=3.11"
dependencies = [
    "lea-server",
]

[tool.uv.sources]
lea-server = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["packages/lea-server/src", "packages/lea-graph/src", "packages/lea-apps/src", "packages/lea-rag/src", "packages/lea-data/src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
