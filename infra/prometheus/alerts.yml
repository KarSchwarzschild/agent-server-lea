# 真实覆盖：21 条规则，引用的指标**全部有埋点**（2026-10-15 收口）。
#
# 这里原来记着"15 条有数、6 条是哑炮"。那 6 条引用的指标在 /metrics 上永远没数，
# 原因不是名字写错，而是埋点没接 —— lea-config / lea-rag / lea-tools 三个
# metrics.py 里的 10 个 record_* 函数全部只有定义、零调用点。现在都接上了：
#   CacheInvalidationRateHigh   <- record_agent_config_load  → api/agents.py
#   DBQueryLatencyP95High       <- record_db_query           → 挂在 SQLAlchemy 引擎上
#   KBSearchHighLatency         <- record_kb_search          → server_kb.py
#   EmbeddingHighLatency        <- record_embedding          → EmbeddingClient._post/_apost
#   ToolExecutionHighErrorRate  <- record_tool_execution     → executor/router.py
#   SandboxExecutionTimeout     <- record_sandbox_execution  → api/sandbox.py
#
# 当时没有删这些规则是对的：要告警的事情都是真该告警的，缺的是埋点，删了等于把
# 需求也删了。
#
# scripts/check_alert_metrics.py 现在在 CI 里以 LEA_STRICT_INSTRUMENTATION=1 跑
# （.gitlab-ci.yml 的 alert-metrics job），所以再出现死埋点会直接拦在门口。
#
# ⚠️ "有埋点"不等于"有数"。指标要等**对应的代码路径真的被走过**才会出现序列：
# 比如 SandboxExecutionTimeout 要等有人真在沙箱里跑代码。所以 Prometheus 里查到
# 0 条时先想想那条路径这段时间有没有流量，别急着当成哑炮 —— 区别在于现在它**会**
# 在有流量时出数，而以前永远不会。
groups:
  - name: lea-platform-critical
    interval: 30s
    rules:
      # ========== 熔断器告警 ==========

      - alert: CircuitBreakerOpen
        expr: lea_agent_circuit_breaker_state > 1
        for: 1m
        labels:
          severity: critical
          service: lea-agent
        annotations:
          summary: "KB/Memory 熔断器打开"
          description: |
            熔断器已打开，外部服务可能故障。
            Instance: {{ $labels.instance }}
            State: {{ $value }}
          dashboard: "http://grafana:3000/d/lea-platform-health"

      # ========== 错误率告警 ==========

      - alert: HighErrorRate5xx
        expr: |
          (
            sum(rate(lea_agent_http_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(lea_agent_http_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          service: lea-agent
        annotations:
          summary: "lea-agent 5xx 错误率超过 5%"
          description: |
            5xx 错误率: {{ $value | humanizePercentage }}
            Instance: {{ $labels.instance }}
            需立即调查服务日志。

      - alert: HighErrorRateConfig
        expr: |
          (
            sum(rate(lea_config_http_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(lea_config_http_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          service: lea-config
        annotations:
          summary: "lea-config 5xx 错误率超过 5%"
          description: |
            5xx 错误率: {{ $value | humanizePercentage }}
            Instance: {{ $labels.instance }}

      - alert: HighErrorRateRag
        expr: |
          (
            sum(rate(lea_rag_http_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(lea_rag_http_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          service: lea-rag
        annotations:
          summary: "lea-rag 5xx 错误率超过 5%"
          description: |
            5xx 错误率: {{ $value | humanizePercentage }}
            Instance: {{ $labels.instance }}

      - alert: HighErrorRateTools
        expr: |
          (
            sum(rate(lea_tools_http_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(lea_tools_http_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          service: lea-tools
        annotations:
          summary: "lea-tools 5xx 错误率超过 5%"
          description: |
            5xx 错误率: {{ $value | humanizePercentage }}
            Instance: {{ $labels.instance }}

      # lea-parser 原来没有这条 —— 另外五个服务都有，只有它漏了。
      # lea_parser_http_requests_total 是补指标端点时（12f3987）加的，加完没回来
      # 补告警，所以解析服务的 5xx 一直没人看。阈值和兄弟规则保持一致。
      #
      # ⚠️ status 标签是**分桶**的（`2xx`/`3xx`/`4xx`/`5xx`），不是三位数字 ——
      # 四个 Python 服务的 _status_to_label() 都这么填，网关也是。所以这里写
      # status="5xx" 而不是 status=~"5.."。
      #
      # 上面那四条兄弟规则用的是 `=~"5.."`，它们**能工作但属于巧合**：正则是全锚定
      # 的，`.` 刚好把 `5xx` 里的两个 x 各匹配一个。留着不动（改动在跑的规则没收益），
      # 但别照抄 —— 照着那个写法去写 status="500" 会得到一条永不触发的哑弹，因为
      # 三位数字的 status 值在这个系统里从来不存在。
      - alert: HighErrorRateParser
        expr: |
          (
            sum(rate(lea_parser_http_requests_total{status="5xx"}[5m]))
            /
            sum(rate(lea_parser_http_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          service: lea-parser
        annotations:
          summary: "lea-parser 5xx 错误率超过 5%"
          description: |
            5xx 错误率: {{ $value | humanizePercentage }}
            解析失败会让"上传文档后搜不到内容"，但用户看到的是上传成功。
            按格式看哪类文件在失败：
              sum by (format) (rate(lea_parser_parse_total{status="error"}[5m]))

      # ========== 静默失败告警 ==========
      #
      # 上面那六条看的都是 5xx。但这个系统里有一整类故障**根本不产生 5xx**：
      #
      #   - 向量库挂了 → _hybrid_search 吞掉异常返回 []，接口照常 200
      #   - 部分知识库组失败 → 返回残缺结果 + 200，调用方看不出少了东西
      #   - MCP / 沙箱失败 → 按约定返回 ToolResult(status="error") 而不是抛异常
      #   - 文档解析失败 → 在 celery 任务里，压根不经过 HTTP
      #
      # 这些路径全都有埋点（record_vector_db_query 的 _error 后缀就是专门为了把
      # "向量库挂了"和"真的没匹配内容"分开才加的），但在 2026-10-19 之前**没有
      # 任何一条告警在用它们**。埋点有了、数据有了、没人看 —— 和之前那批死埋点
      # 是镜像关系：那批是规则有、埋点没有，这批是埋点有、规则没有。
      #
      # 判定用比率而不是绝对值：这几条路径的流量都不高，单次抖动（1/100）不该告警，
      # 但依赖真挂了的时候比率会冲到接近 1。分母为 0 时 PromQL 返回 NaN，比较结果
      # 为假，不会误报。

      - alert: VectorDBErrors
        # operation 标签里带 _error 后缀的是失败态，分母是全部操作。
        # 这是"Milvus 挂了"唯一会动的信号 —— 检索接口此时返回 200 + 空结果。
        expr: |
          (
            sum(rate(lea_rag_vector_db_queries_total{operation=~".*_error"}[5m]))
            /
            sum(rate(lea_rag_vector_db_queries_total[5m]))
          ) > 0.1
        for: 5m
        labels:
          severity: critical
          service: lea-rag
        annotations:
          summary: "向量库操作失败率 > 10%（检索会静默返回空结果）"
          description: |
            失败率: {{ $value | humanizePercentage }}
            看是哪类操作在失败：
              sum by (operation) (rate(lea_rag_vector_db_queries_total{operation=~".*_error"}[5m]))
            search_* 失败 → 用户搜不到东西但界面不报错
            insert_error → 文档入库失败，表现是"上传成功但搜不到"

      - alert: KBSearchPartialResults
        # partial 是 server_kb.py 里专门为"部分模型组失败、函数照常 200 返回
        # 残缺结果"设的状态。这件事 5xx 抓不到（根本没报错），而用户和调用方
        # 都看不出有知识库掉出了结果集。
        expr: |
          (
            sum(rate(lea_rag_kb_search_total{status="partial"}[5m]))
            /
            sum(rate(lea_rag_kb_search_total[5m]))
          ) > 0.05
        for: 10m
        labels:
          severity: warning
          service: lea-rag
        annotations:
          summary: "知识库检索有 > 5% 返回残缺结果（静默降级）"
          description: |
            比例: {{ $value | humanizePercentage }}
            有知识库从结果集里掉出去了，但接口返回 200。
            容器日志里 kb_search_error 那条会写明是哪个模型组失败的。

      - alert: EmbeddingErrors
        # 中转 API 不可用 / key 过期时的信号。这条路径在检索时会抛异常变成 5xx，
        # 但在 celery 入库任务里只会让文档卡住 —— 两边都要有人看。
        expr: |
          (
            sum(rate(lea_rag_embedding_total{status="error"}[5m]))
            /
            sum(rate(lea_rag_embedding_total[5m]))
          ) > 0.1
        for: 5m
        labels:
          severity: critical
          service: lea-rag
        annotations:
          summary: "Embedding 调用失败率 > 10%（中转 API 或 key 的问题）"
          description: |
            失败率: {{ $value | humanizePercentage }}
            embedding 挂了的后果分两头：检索侧抛 5xx，入库侧让文档永远卡在
            processing。先确认中转 API 的 key 还有效。

      - alert: EmbeddingDegenerate
        # 上面那条看的是"请求失败了"。这条看的是**请求成功了但向量是废的** ——
        # 中转 API key 过期时不一定回非 2xx，回 200 带全零向量的话
        # raise_for_status() 不抛、解析也不抛，status="error" 永远不涨。
        #
        # 后果比"搜不到"严重：零向量照样能算余弦相似度，于是检索返回一堆和
        # 查询无关的结果、HTTP 200、界面上看不出任何异常 —— 自信地给错答案。
        # 判定逻辑在 embedding_client.py 的 _degenerate_reason（条数不符/全零/空）。
        #
        # 阈值刻意比 EmbeddingErrors 低一个量级：废向量是"不该存在"的东西，
        # 偶发一次就意味着有一批 chunk 被永久错向量化了（入库时写进 Milvus 就固化
        # 了，不会自愈），所以 1% 就该看。
        expr: |
          (
            sum(rate(lea_rag_embedding_total{status="degenerate"}[10m]))
            /
            sum(rate(lea_rag_embedding_total[10m]))
          ) > 0.01
        for: 5m
        labels:
          severity: critical
          service: lea-rag
        annotations:
          summary: "Embedding 返回废向量（上游假成功，正在写入错误的向量）"
          description: |
            比例: {{ $value | humanizePercentage }}
            上游回了 200 但向量不可用（全零 / 条数不符 / 空）。
            容器日志里 embedding_degenerate 那条会写明具体原因和模型名：
              docker logs lea-rag-test 2>&1 | grep embedding_degenerate
            先确认中转 API 的 key 还有效。**入库侧发生过的话，那批文档需要重新
            向量化** —— 零向量写进 Milvus 之后不会自己恢复。

      - alert: DocumentParseFailing
        # 在 celery 任务里（tasks.py），不经过 HTTP，所以 5xx 和 HTTP 指标都看不到。
        # 单个坏文件（损坏的 PDF）是用户的问题不是系统的问题，所以用比率 + 长窗口，
        # 只在"大面积失败"时才响。
        expr: |
          (
            sum(rate(lea_rag_document_parse_total{status="failed"}[15m]))
            /
            sum(rate(lea_rag_document_parse_total[15m]))
          ) > 0.2
        for: 15m
        labels:
          severity: warning
          service: lea-rag
        annotations:
          summary: "文档解析失败率 > 20%（持续 15 分钟）"
          description: |
            失败率: {{ $value | humanizePercentage }}
            用户侧表现是"上传成功但搜不到内容"。
            retry 态单独看：rate(lea_rag_document_parse_total{status="retry"}[15m])

      - alert: MCPCallsFailing
        # bad_request 不算（那是调用方参数错，不是依赖故障）。
        # 阈值比别的高：第三方 MCP server 本身就不稳定，20% 以下属于常态。
        expr: |
          (
            sum(rate(lea_tools_mcp_calls_total{status=~"error|unreachable|http_error"}[5m]))
            /
            sum(rate(lea_tools_mcp_calls_total[5m]))
          ) > 0.2
        for: 10m
        labels:
          severity: warning
          service: lea-tools
        annotations:
          summary: "MCP 调用失败率 > 20%"
          description: |
            失败率: {{ $value | humanizePercentage }}
            按 server 看是谁在失败（server_name 标签是白名单化的，不会爆基数）：
              sum by (server_name, status) (rate(lea_tools_mcp_calls_total{status=~"error|unreachable|http_error"}[5m]))
            unreachable 集中在一个 server 上 → 那个 server 自己的问题；
            全面 unreachable → 大概是出网或 DNS。

      - alert: SandboxUnavailable
        # unavailable 的含义是沙箱后端压根连不上（SANDBOX_BACKEND 没配会静默
        # fallback 到 mock，Cube 服务挂了也是这个态）。这不是"执行失败"而是
        # "功能整体没了"，所以不用比率 —— 有就该看。
        expr: |
          increase(lea_tools_sandbox_executions_total{status="unavailable"}[5m]) > 0
          or
          increase(lea_tools_file_operations_total{status="unavailable"}[5m]) > 0
        for: 5m
        labels:
          severity: critical
          service: lea-tools
        annotations:
          summary: "沙箱后端不可达（代码执行和文件读写整体不可用）"
          description: |
            5 分钟内有 {{ $value }} 次请求因为后端连不上被挡掉。
            接口返回的是 200 + status=error，调用方不一定看得出来。
            先确认 Cube 沙箱（10.192.241.137:3000）活着、SANDBOX_BACKEND 配了。

      # ========== 网关告警 ==========
      #
      # 网关是所有请求的必经之路，所以它的错误率是**唯一能反映"用户到底能不能用"
      # 的指标** —— 下游某个服务挂了，这里一定也会红；反过来这里红了但下游都绿，
      # 说明问题在网关自己（鉴权、租户解析、路由表漏注册）。

      - alert: HighErrorRateGateway
        expr: |
          (
            sum by (instance) (rate(lea_gateway_http_requests_total{job="lea-gateway",status="5xx"}[5m]))
            /
            sum by (instance) (rate(lea_gateway_http_requests_total{job="lea-gateway"}[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          service: lea-gateway
        annotations:
          summary: "lea-gateway 5xx 错误率超过 5%"
          description: |
            5xx 错误率: {{ $value | humanizePercentage }}
            Instance: {{ $labels.instance }}
            网关的 5xx 多半是反代上游失败（502）。先看下游各服务的 up 和错误率，
            全绿的话再查网关自己。

      # 鉴权大面积拒绝 —— 这条抓的是"登录整体坏了"，不是个别用户 token 过期。
      #
      # 用比例而不是绝对速率：绝对值跟流量相关，低峰期永远不触发，高峰期又会被
      # 正常的过期 token 噪声打扰。而 JWKS 拉不到 / issuer 配错 / 时钟偏移这几种
      # 真故障的表现都是**几乎所有请求都被拒**，比例一定飙到接近 1。
      #
      # 0.5 这个阈值的含义：一半以上的请求连鉴权都过不了，不可能是正常业务形态。
      - alert: GatewayAuthRejectionSpike
        expr: |
          (
            sum by (instance) (rate(lea_gateway_auth_rejections_total{job="lea-gateway"}[5m]))
            /
            sum by (instance) (rate(lea_gateway_http_requests_total{job="lea-gateway"}[5m]))
          ) > 0.5
        for: 5m
        labels:
          severity: critical
          service: lea-gateway
        annotations:
          summary: "lea-gateway 过半请求被鉴权拒绝"
          description: |
            拒绝比例: {{ $value | humanizePercentage }}
            按 reason 分组看 lea_gateway_auth_rejections_total：
              invalid_token 占多数 → JWKS 拉不到、issuer 配错、或者时钟偏移；
              missing_token 占多数 → 前端没带 Authorization，多半是前端发版问题。
            网关日志里 gateway_auth_rejected 那行有具体原因。

      # 租户归属解析失败。这是 403 的主因，而且依赖的是**外部**接口
      # （TENANT_MEMBERSHIP_URL，默认 ai.ouchn.edu.cn），对方挂了这边全员 403。
      # 跟鉴权失败分开告警，就是为了一眼区分"登录坏了"还是"租户服务坏了"。
      - alert: GatewayTenantResolveFailing
        expr: rate(lea_gateway_tenant_resolve_failures_total{job="lea-gateway"}[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
          service: lea-gateway
        annotations:
          summary: "lea-gateway 租户归属解析持续失败"
          description: |
            失败速率: {{ $value }}/s
            依赖的是外部租户接口（TENANT_MEMBERSHIP_URL），先确认对方是否可达。
            表现在用户侧是"选了租户还是 403"。

      # ========== agent-worker（Temporal 异步执行）==========
      #
      # 这几条用的是 Temporal SDK 自带的指标（internal/temporalrun/Dial() 里挂了
      # MetricsHandler 就有），不是我们埋的点。
      #
      # schedule_to_start 是"活排进队列到被 worker 接走"的时间，官方把它当作判断
      # worker 够不够的首选信号。它涨说明 worker 不够用或者卡住了 —— 跟 activity
      # 自己执行慢（LLM 本来就慢）是两件事，别混。
      #
      # 阈值 10s：这个项目的 activity 执行动辄几十秒，但**排队**不该排这么久。
      # for: 10m 是为了避开上传高峰那种短时堆积。
      #
      # 这条**刻意不写 sum by (le)**，跟下面几条 histogram_quantile 不一样：不聚合的
      # 话 Prometheus 按剩余标签逐组合算分位数，于是能看出是**哪类 activity** 在堆
      # 积（activity_type / workflow_type 分开），这正是排查时要的第一个信息。
      # 其他几条（DB 查询、KB 检索、向量化、HTTP）要的是服务整体健康，所以聚合。
      # 标签基数核过，都是有界的常量集合，不会因为不聚合而把序列数顶上去。
      - alert: AgentWorkerQueueLatencyHigh
        expr: |
          histogram_quantile(0.95,
            rate(temporal_activity_schedule_to_start_latency_bucket[10m])
          ) > 10
        for: 10m
        labels:
          severity: warning
          service: lea-agent-worker
        annotations:
          summary: "agent-worker 活排队 P95 超过 10s"
          description: |
            P95 排队延迟: {{ $value }}s
            活已经排进队列但 worker 迟迟接不走。要么 worker 不够用（加副本），
            要么它卡住了。注意这跟 activity 执行慢是两件事 —— 执行慢看
            temporal_activity_execution_latency。

      # activity 持续失败。failure_reason 是 6 个固定取值之一，按它分组能分清
      # 是业务错（ActivityError）还是消息体过大（PayloadsTooLarge）这类系统问题。
      - alert: AgentWorkerActivityFailing
        expr: rate(temporal_activity_execution_failed[10m]) > 0.1
        for: 10m
        labels:
          severity: warning
          service: lea-agent-worker
        annotations:
          summary: "agent-worker activity 持续失败"
          description: |
            失败速率: {{ $value }}/s
            按 failure_reason 分组看 temporal_activity_execution_failed。
            用户侧的表现是消息发出去没有回复（或者回复到一半断掉）。

      # ========== 缓存告警 ==========

      - alert: CacheInvalidationRateHigh
        expr: |
          (
            sum(rate(lea_config_agent_config_loads_total{status="cache_miss"}[5m]))
            /
            sum(rate(lea_config_agent_config_loads_total[5m]))
          ) > 0.1
        for: 10m
        labels:
          severity: warning
          service: lea-config
        annotations:
          summary: "Agent 配置缓存失效率 > 10%"
          description: |
            缓存失效率: {{ $value | humanizePercentage }}
            Instance: {{ $labels.instance }}
            检查 Redis 连接和容量。

      # CacheMissRate 删掉了（2026-10-13）。它用的 lea_config_cache_misses_total /
      # lea_config_cache_requests_total 两个指标在代码里不存在，所以这条规则从来
      # 不会触发；而它想表达的事情跟上面那条 CacheInvalidationRateHigh 重复 ——
      # 那条用的 lea_config_agent_config_loads_total{status="cache_miss"} 是真实存在的。

      # ========== 数据库告警 ==========

      # 补了 _bucket + rate（2026-10-15）。原来是
      #   histogram_quantile(0.95, lea_config_db_query_duration_seconds) > 1
      # 少 _bucket 的后果见 SlowHTTPResponse 那条的注释：永远 0 条，不会报警。
      - alert: DBQueryLatencyP95High
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(lea_config_db_query_duration_seconds_bucket[5m]))
          ) > 1
        for: 5m
        labels:
          severity: warning
          service: lea-config
        annotations:
          summary: "数据库查询 P95 延迟 > 1 秒"
          description: |
            P95 延迟: {{ $value | humanizeDuration }}
            Instance: {{ $labels.instance }}
            检查数据库是否有慢查询或索引缺失。

      # DBConnectionPoolExhausted 注释掉了（2026-10-13）：
      # lea_config_db_connection_pool_usage 这个指标在代码里不存在，规则永不触发。
      #
      # 连接池耗尽是很值得告警的一件事，所以这条**该补**而不是该删 —— 要补的是埋点：
      # 在 lea-config 里把 SQLAlchemy 的 pool.status()（checkedout / pool_size）
      # 导成一个 Gauge，然后把下面三行打开。
      #
      # - alert: DBConnectionPoolExhausted
      #   expr: lea_config_db_connection_pool_usage > 0.8
      #   for: 5m
      #   labels:
      #     severity: warning
      #     service: lea-config
      #   annotations:
      #     summary: "数据库连接池使用率 > 80%"
      #     description: "增加连接池大小或优化查询。"

      # ========== KB/RAG 告警 ==========

      # 补了 _bucket + rate（2026-10-15），同 SlowHTTPResponse。
      - alert: KBSearchHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(lea_rag_kb_search_duration_seconds_bucket[5m]))
          ) > 1
        for: 5m
        labels:
          severity: warning
          service: lea-rag
        annotations:
          summary: "知识库检索 P95 延迟 > 1 秒"
          description: |
            P95 延迟: {{ $value | humanizeDuration }}
            Instance: {{ $labels.instance }}

      # 补了 _bucket + rate（2026-10-15），同 SlowHTTPResponse。
      - alert: EmbeddingHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(lea_rag_embedding_duration_seconds_bucket[5m]))
          ) > 2
        for: 5m
        labels:
          severity: warning
          service: lea-rag
        annotations:
          summary: "向量化处理 P95 延迟 > 2 秒"
          description: |
            P95 延迟: {{ $value | humanizeDuration }}
            Instance: {{ $labels.instance }}

      # ========== Tool 执行告警 ==========

      - alert: ToolExecutionHighErrorRate
        expr: |
          (
            sum(rate(lea_tools_tool_executions_total{status="error"}[5m]))
            /
            sum(rate(lea_tools_tool_executions_total[5m]))
          ) > 0.1
        for: 10m
        labels:
          severity: warning
          service: lea-tools
        annotations:
          summary: "工具执行错误率 > 10%"
          description: |
            错误率: {{ $value | humanizePercentage }}
            Instance: {{ $labels.instance }}
            检查沙箱和 MCP 连接状态。

      # 原来用的 lea_tools_sandbox_timeouts_total 不存在。实际有的是
      # lea_tools_sandbox_executions_total，带 status 标签 —— 所以按 status 过滤
      # 来表达同一件事，不用新加埋点。
      #
      # status 的取值已核对：success / error / timeout
      # （packages/lea-tools/src/lea_tools/metrics.py:58，打点在同文件 148 行）。
      - alert: SandboxExecutionTimeout
        expr: rate(lea_tools_sandbox_executions_total{status="timeout"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
          service: lea-tools
        annotations:
          summary: "沙箱执行超时"
          description: |
            超时率: {{ $value }}/s
            Instance: {{ $labels.instance }}

      # ========== retrieval-worker（异步文档处理）==========
      #
      # 这条是之前那条 CeleryTaskQueueLarge 的替代。删掉它的时候我给的理由是
      # "Celery 已经不在调用链里"，那是**错的** —— 文档上传的三个入口
      # （server_kb.py:546 / server_user_kb.py / server_governance.py）都在往
      # retrieval 队列投任务。真实原因是另一个：它引用的 lea_rag_celery_queue_size
      # 在代码里从来不存在，所以是条永不触发的哑炮，而面板上显示"队列堆积已覆盖"。
      # 现在埋了 lea_rag_celery_queue_depth，才把告警加回来。
      #
      # ⚠️ 必须用 max() 不能用 sum()：这个 gauge 是在 **lea-rag API 进程**里量
      # broker 得到的，多副本时每个副本都报同一个值，sum() 会按副本数翻倍。
      #
      # 为什么这条值得有：retrieval-worker 的 healthcheck 是 disable 的、进程里
      # 没有任何埋点。它挂掉的表现是上传接口照常返回 status="processing"，然后
      # 文档永远停在 processing、知识库里搜不到内容 —— 没有这条告警，这件事只能
      # 靠用户来报。
      - alert: RetrievalQueueBacklog
        expr: max(lea_rag_celery_queue_depth{queue="retrieval"}) > 100
        for: 15m
        labels:
          severity: warning
          service: lea-rag
        annotations:
          summary: "文档处理队列堆积 > 100（持续 15 分钟）"
          description: |
            当前深度: {{ $value }}
            要么 retrieval-worker 没在干活（容器 Running 但进程卡死也是这个表现，
            它没有健康检查），要么上传量超过了处理能力。
            先 docker logs lea-rag-retrieval-worker-test 看日志还在不在滚。

      # ========== 可观测性本身的告警 ==========

      - alert: PrometheusScrapeFailed
        expr: up{job=~"lea-.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus 无法采集 {{ $labels.job }}"
          description: |
            服务: {{ $labels.job }}
            Instance: {{ $labels.instance }}
            服务可能已宕机。

      - alert: PrometheusHighMemoryUsage
        expr: process_resident_memory_bytes{job="prometheus"} > 1e9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus 内存使用 > 1GB"
          description: |
            当前内存: {{ $value | humanize }}B
            可能需要调整数据保留期。

  - name: lea-platform-warnings
    interval: 1m
    rules:
      # ========== 低优先级告警 ==========

      # 两处都修过（2026-10-15），原来是：
      #   histogram_quantile(0.99, lea_agent_http_request_duration_seconds) > 5
      #
      # 1) 少了 _bucket。histogram_quantile 要的是带 le 标签的 bucket 序列，直接喂
      #    指标名匹配不到任何东西 —— 规则语法合法、加载正常、**永远返回 0 条**。
      #    实测过：换成 _bucket + rate 之后同一时刻有数（P99 ≈ 10ms）。
      #    注意这种哑炮躲过了 scripts/check_alert_metrics.py，因为那个脚本只校验
      #    指标**名**存在，而 lea_agent_http_request_duration_seconds 确实是
      #    _bucket/_sum/_count 的共同前缀，在源码里搜得到。
      #
      # 2) 必须排掉流式端点。SSE 的 duration 记的是**整条连接的存活时长**，不是
      #    响应速度：一次正常对话挂 12 秒很常见，挂几分钟也正常。不排除的话用户
      #    一聊天这条就响，而它想抓的是"接口变慢了"。
      #    POST /api/chat/stream 和 GET /api/chat/stream/:session_id 都是 SSE
      #    （见 internal/router/routes.go:38,42）。
      - alert: SlowHTTPResponse
        expr: |
          histogram_quantile(0.99,
            sum by (le) (
              rate(lea_agent_http_request_duration_seconds_bucket{
                endpoint!~"/api/chat/stream.*"
              }[5m])
            )
          ) > 5
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "HTTP 请求 P99 延迟 > 5 秒（已排除 SSE 流式端点）"
          description: |
            P99 延迟: {{ $value | humanizeDuration }}
            Instance: {{ $labels.instance }}

      # CeleryTaskQueueLarge 删掉了（2026-10-13）。
      #
      # 更正（2026-10-15）：原来这里写的第二个理由"Celery 已经不在调用链里、只剩
      # 归档代码"是**错的** —— lea-rag 里有三个活跃的 .delay() 派发点，
      # retrieval-worker 容器一直在真干活。删掉这条规则的唯一正确理由是第一个：
      # lea_rag_celery_queue_size 这个指标名在代码里从来不存在，规则永不触发。
      #
      # 队列堆积现在有真埋点了：lea_rag_celery_queue_depth（在 API 进程里后台采样
      # Redis 的 LLEN，见 lea_rag/metrics.py），告警是本文件里的
      # RetrievalQueueBacklog。Temporal 那条队列走 SDK 侧的
      # temporal_activity_schedule_to_start_latency（见 AgentWorkerQueueLatencyHigh）。
      # Temporal server 侧的 temporal_task_queue_* 还没开（auto-setup 容器没配
      # 指标监听），那是另一个口子，不是这条的替代。

      - alert: SessionMemoryHigh
        # 指标名是 lea_agent_active_sessions（metrics.go:99），原来写的
        # lea_agent_session_count 不存在 —— 这条告警因此从来不会触发。
        expr: lea_agent_active_sessions > 400
        for: 10m
        labels:
          severity: warning
          service: lea-agent
        annotations:
          summary: "会话数超过 400（容量限制 500）"
          description: |
            当前会话数: {{ $value }}
            Instance: {{ $labels.instance }}

      # AttachmentLoadFailures 注释掉了（2026-10-13）：
      # lea_agent_session_attachments_load_errors_total 这个指标不存在，规则永不触发。
      #
      # 这条**该补埋点**而不是该删。挂载加载失败是故意 fail-soft 的（见
      # session/manager.go 里 mergeSessionAttachments 那段注释：整段失败只记日志不
      # 阻断，因为"少几个临时工具比整段对话打不开轻得多"）—— 正因为它对用户不可见,
      # 才需要指标兜着，否则这类故障只存在于日志里，没人会发现。
      #
      # 补法：在 mergeSessionAttachments 的失败分支里 inc 一个 Counter。
      #
      # - alert: AttachmentLoadFailures
      #   expr: increase(lea_agent_session_attachments_load_errors_total[5m]) > 0
      #   for: 5m
      #   labels:
      #     severity: info
      #   annotations:
      #     summary: "会话级挂载加载失败"
