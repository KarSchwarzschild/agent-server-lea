openapi: 3.0.0
info:
  title: LEA Platform API
  description: LEA Platform 完整 API 规范，提供给第三方平台集成使用
  version: 1.0.0
  contact:
    name: LEA Platform Support
    email: support@lea-platform.com
  license:
    name: Apache 2.0

servers:
  - url: https://api.lea-platform.com/api
    description: Production environment
  - url: http://localhost:8100/api
    description: Development environment

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Session:
      type: object
      properties:
        id:
          type: string
          example: sess_abc123
        user_id:
          type: string
          example: user_123
        project_id:
          type: string
          example: proj_456
        active_agent_id:
          type: integer
          example: 0
        title:
          type: string
          example: 新对话
        message_count:
          type: integer
          example: 5
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Message:
      type: object
      properties:
        id:
          type: string
          example: msg_123
        session_id:
          type: string
          example: sess_abc123
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        created_at:
          type: string
          format: date-time

    Project:
      type: object
      properties:
        id:
          type: string
          example: proj_123
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time

    File:
      type: object
      properties:
        id:
          type: string
          example: file_123
        name:
          type: string
        size:
          type: integer
        kind:
          type: string
          enum: [upload, artifact]
        created_at:
          type: string
          format: date-time

    Attachment:
      type: object
      properties:
        id:
          type: string
        session_id:
          type: string
        kind:
          type: string
          enum: [tool, skill, kb, mcp_server]
        ref_id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        error:
          type: object
          properties:
            field:
              type: string
            reason:
              type: string

    SuccessResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: object

paths:
  /sessions:
    post:
      summary: 创建会话
      tags:
        - Sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                project_id:
                  type: string
                agent_id:
                  type: integer
                title:
                  type: string
              required:
                - user_id
      responses:
        '200':
          description: 会话创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Session'

    get:
      summary: 获取会话列表
      tags:
        - Sessions
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: project_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Session'
                      total:
                        type: integer
                      page:
                        type: integer
                      page_size:
                        type: integer

  /sessions/{session_id}:
    get:
      summary: 获取单个会话
      tags:
        - Sessions
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 会话详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Session'
        '404':
          description: 会话不存在

    delete:
      summary: 删除会话
      tags:
        - Sessions
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 删除成功

  /sessions/{session_id}/messages:
    get:
      summary: 获取会话消息
      tags:
        - Sessions
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: 消息列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      messages:
                        type: array
                        items:
                          $ref: '#/components/schemas/Message'
                      total:
                        type: integer

  /sessions/{session_id}/active-agent:
    put:
      summary: 切换激活 Agent
      tags:
        - Sessions
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_id:
                  type: integer
              required:
                - agent_id
      responses:
        '200':
          description: Agent 切换成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                      applies:
                        type: string
                        enum: [next_message, after_current_turn]
                      agent_id:
                        type: integer
        '400':
          description: 请求参数错误
        '403':
          description: 无权限访问该 agent
        '404':
          description: 会话不存在
        '409':
          description: 会话不属于当前用户

  /chat/stream:
    post:
      summary: 发送消息（流式响应）
      tags:
        - Chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
                content:
                  type: string
                agent_id:
                  type: integer
              required:
                - session_id
                - content
      responses:
        '200':
          description: 流式消息响应
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE 格式的事件流

  /chat/status/{session_id}:
    get:
      summary: 获取聊天状态
      tags:
        - Chat
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 聊天状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      session_id:
                        type: string
                      is_generating:
                        type: boolean
                      last_message_id:
                        type: string
                      total_messages:
                        type: integer

  /chat/stop/{session_id}:
    post:
      summary: 停止生成
      tags:
        - Chat
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 生成已停止

  /chat/attachments/upload:
    post:
      summary: 上传附件
      tags:
        - Chat
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                session_id:
                  type: string
                description:
                  type: string
              required:
                - file
                - session_id
      responses:
        '200':
          description: 附件上传成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      attachment_id:
                        type: string
                      filename:
                        type: string
                      size:
                        type: integer
                      mime_type:
                        type: string
                      created_at:
                        type: string
                        format: date-time

  /chat/attachments/{attachment_id}/download:
    get:
      summary: 下载附件
      tags:
        - Chat
      parameters:
        - name: attachment_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 文件内容
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /sessions/{session_id}/attachments:
    post:
      summary: 会话挂载（添加工具/知识库）
      tags:
        - Sessions
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum: [tool, skill, kb, mcp_server]
                ref_id:
                  type: string
              required:
                - kind
                - ref_id
      responses:
        '200':
          description: 挂载成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Attachment'

    get:
      summary: 获取会话挂载列表
      tags:
        - Sessions
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 挂载列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      attachments:
                        type: array
                        items:
                          $ref: '#/components/schemas/Attachment'

  /sessions/{session_id}/attachments/{kind}/{ref_id}:
    delete:
      summary: 取消会话挂载
      tags:
        - Sessions
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
        - name: kind
          in: path
          required: true
          schema:
            type: string
        - name: ref_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 取消挂载成功

  /projects:
    post:
      summary: 创建项目
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
              required:
                - name
      responses:
        '200':
          description: 项目创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'

    get:
      summary: 获取项目列表
      tags:
        - Projects
      responses:
        '200':
          description: 项目列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      projects:
                        type: array
                        items:
                          $ref: '#/components/schemas/Project'

  /projects/{project_id}:
    put:
      summary: 更新项目
      tags:
        - Projects
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: 项目更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'

    delete:
      summary: 删除项目
      tags:
        - Projects
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 项目删除成功

  /projects/{project_id}/archive:
    post:
      summary: 归档项目
      tags:
        - Projects
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 项目归档成功

  /user/files:
    get:
      summary: 列出用户文件
      tags:
        - Files
      responses:
        '200':
          description: 用户文件列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      files:
                        type: array
                        items:
                          $ref: '#/components/schemas/File'

  /user/storage:
    get:
      summary: 获取用户存储信息
      tags:
        - Files
      responses:
        '200':
          description: 存储信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      used:
                        type: integer
                      total:
                        type: integer
                      used_percent:
                        type: number

  /user/files/{kind}/{file_id}:
    delete:
      summary: 删除用户文件
      tags:
        - Files
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [upload, artifact]
        - name: file_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 文件删除成功

  /sessions/{session_id}/files/import:
    post:
      summary: 导入文件到会话
      tags:
        - Files
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                file_id:
                  type: string
              required:
                - file_id
      responses:
        '200':
          description: 文件导入成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      session_file_id:
                        type: string

  /sessions/{session_id}/files/publish:
    post:
      summary: 发布会话文件
      tags:
        - Files
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_file_id:
                  type: string
                filename:
                  type: string
              required:
                - session_file_id
                - filename
      responses:
        '200':
          description: 文件发布成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      artifact_id:
                        type: string
                      filename:
                        type: string
                      url:
                        type: string
