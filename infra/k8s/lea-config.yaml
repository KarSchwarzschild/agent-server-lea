# lea-config —— Agent / 技能 / 模型配置 :8500。集群内服务。
#
# 无状态（只读 DB），所以扩容没有任何附加条件。
# 结构上的说明见 lea-agent.yaml（探针分工那段同样适用）。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lea-config
  labels: {app: lea-config}
spec:
  replicas: 2
  selector:
    matchLabels: {app: lea-config}
  template:
    metadata:
      labels: {app: lea-config}
    spec:
      # 私有 registry 必需。用
      #   kubectl create secret docker-registry lea-registry \
      #       --docker-server=<registry> --docker-username=<u> --docker-password=<p>
      # 创建；名字对不上的表现是 Pod 卡在 ImagePullBackOff。
      imagePullSecrets:
        - name: lea-registry
      containers:
        - name: lea-config
          # ⚠️ 占位符。部署前替换成 registry 地址 + 不可变 tag，例如
          #     swr.<region>.myhuaweicloud.com/<组织>/lea-config:<commit-sha>
          # **用 commit sha，不要用 latest** —— 用 latest 就回到了"线上跑的是哪个
          # commit 查不出来"那个问题。CI 每次构建都会打 sha tag，见 .gitlab-ci.yml。
          image: lea-config:REPLACE_ME
          imagePullPolicy: Always
          ports:
            - {name: http, containerPort: 8500}
          envFrom:
            - configMapRef: {name: lea-common}
            - secretRef: {name: lea-secrets}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: lea-config
spec:
  type: ClusterIP
  selector: {app: lea-config}
  ports:
    - {name: http, port: 8500, targetPort: http}
