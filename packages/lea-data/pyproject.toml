[project]
name = "lea-data"
version = "0.1.0"
description = "LEA Platform 数据管道（反馈飞轮 + 分析）"
requires-python = ">=3.11"
dependencies = [
    "lea-graph",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "structlog>=24.0",
]

[tool.uv.sources]
lea-graph = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lea_data"]
