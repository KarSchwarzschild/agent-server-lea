[project]
name = "lea-authkit"
version = "0.1.0"
description = "LEA 服务间鉴权 — 被调方中间件 + 调用方请求头，供所有 Python 服务共用"
requires-python = ">=3.11"
# 故意保持极小。这个包会被每一个 Python 服务依赖，往里加东西等于加到所有服务的
# 镜像上；而且安全代码的依赖面越小越容易审。
dependencies = [
    "fastapi>=0.115",
    "structlog>=24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lea_authkit"]
