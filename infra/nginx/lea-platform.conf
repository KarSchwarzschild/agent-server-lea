# Lea Platform Nginx 配置
# 功能：反向代理 + 三层限流 + 健康检查

# === 限流区定义 ===
# 按用户限流（每个用户每秒 10 个请求）
limit_req_zone $http_x_user_id zone=per_user:10m rate=10r/s;

# 按租户限流（每个租户每秒 50 个请求）
limit_req_zone $http_x_tenant_id zone=per_tenant:10m rate=50r/s;

# 全局限流（整个平台每秒 500 个请求）
limit_req_zone $binary_remote_addr zone=global:10m rate=500r/s;

# === 上游服务定义 ===
upstream lea_agent {
    server lea-agent:8200 max_fails=3 fail_timeout=30s;
}

upstream lea_config {
    server lea-config:8100 max_fails=3 fail_timeout=30s;
}

upstream lea_rag {
    server lea-rag:8300 max_fails=3 fail_timeout=30s;
}

upstream lea_tools {
    server lea-tools:8400 max_fails=3 fail_timeout=30s;
}

# === 主服务器配置 ===
server {
    listen 80;
    server_name _;

    # 日志格式（记录限流信息）
    log_format main_with_limit '$remote_addr - $remote_user [$time_local] "$request" '
                               '$status $body_bytes_sent "$http_referer" '
                               '"$http_user_agent" "$http_x_forwarded_for" '
                               'limit_req_status=$limit_req_status';

    access_log /var/log/nginx/access.log main_with_limit;
    error_log /var/log/nginx/error.log warn;

    # 客户端请求体大小限制（文件上传）
    client_max_body_size 100M;
    client_body_timeout 300s;

    # 代理超时（LLM 生成可能很长）
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;

    # === Agent 服务（SSE 流式响应）===
    location /api/agent/ {
        # 应用三层限流
        limit_req zone=per_user burst=20 nodelay;
        limit_req zone=per_tenant burst=100 nodelay;
        limit_req zone=global burst=1000 nodelay;
        limit_req_status 429;

        # SSE 特殊配置
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;

        # 代理头传递
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 透传认证头（租户、用户）
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
        proxy_set_header X-User-ID $http_x_user_id;
        proxy_set_header X-User-Role $http_x_user_role;

        proxy_pass http://lea_agent;
    }

    # === Config 服务 ===
    location /api/config/ {
        limit_req zone=per_user burst=20 nodelay;
        limit_req zone=per_tenant burst=100 nodelay;
        limit_req zone=global burst=1000 nodelay;
        limit_req_status 429;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
        proxy_set_header X-User-ID $http_x_user_id;

        proxy_pass http://lea_config;
    }

    # === RAG 服务（文档上传限流更严格）===
    location /api/rag/ {
        # 文档上传限流：每个用户 10 秒只能上传 1 次
        limit_req zone=per_user burst=5 nodelay;
        limit_req zone=per_tenant burst=20 nodelay;
        limit_req zone=global burst=100 nodelay;
        limit_req_status 429;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
        proxy_set_header X-User-ID $http_x_user_id;

        proxy_pass http://lea_rag;
    }

    # === Tools 服务 ===
    location /api/tools/ {
        limit_req zone=per_user burst=20 nodelay;
        limit_req zone=per_tenant burst=100 nodelay;
        limit_req zone=global burst=1000 nodelay;
        limit_req_status 429;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
        proxy_set_header X-User-ID $http_x_user_id;

        proxy_pass http://lea_tools;
    }

    # === 健康检查（不限流）===
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # === 限流状态页（内部监控用）===
    location /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;  # Docker 内网
        deny all;
    }

    # === 默认拒绝 ===
    location / {
        return 404 "Not Found\n";
    }
}