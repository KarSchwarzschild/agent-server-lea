[project]
name = "lea-apps"
version = "0.1.0"
description = "LEA Platform 可插拔应用（分产品）"
requires-python = ">=3.11"
dependencies = [
    "lea-graph",
    "lea-rag",
    "langchain-text-splitters>=0.3",
]

[tool.uv.sources]
lea-graph = { workspace = true }
lea-rag = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lea_apps"]
