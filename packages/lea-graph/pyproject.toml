[project]
name = "lea-graph"
version = "0.1.0"
description = "LEA Platform Agent框架层（LangChain + LangGraph）"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.2",
    "langgraph-checkpoint>=2.0",
    "langgraph-checkpoint-redis>=0.2",
    "langmem>=0.0.20",
    "redis>=5.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "httpx>=0.26",
    "tenacity>=8.2",
    "pybreaker>=1.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "structlog>=24.0",
    "mcp>=1.0",
    "langchain-mcp-adapters>=0.2",
    "pyyaml>=6.0",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "boto3>=1.34",
]

[project.optional-dependencies]
# 走真沙箱后端（CubeSandbox / E2B Cloud）才装：
#   uv sync --extra sandbox
sandbox = [
    "e2b-code-interpreter>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lea_graph"]
