global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'lea-platform'
    environment: 'test'

rule_files:
  - 'alerts.yml'

# ── 目标地址用 compose 服务名 ────────────────────────────────────────────────
#
# 这份配置之前的目标全都采不到，实测确认了三个独立的原因，每个都值得记下来：
#
#   1. 主机名错。原来写的是 lea-agent / lea-config / lea-rag，而
#      infra/docker-compose.test-server.yml 里的服务名是 agent / config / rag
#      （容器名才是 lea-agent-test 那种）。compose 网络按**服务名**解析，所以
#      lea-agent 在网络里不存在。
#   2. lea-agent 的端口错。原来写 8200，实际 metrics 挂在主端口 **8100** 的 gin
#      路由上（cmd/server/main.go 里 r.GET("/metrics", ...)），没有独立的指标端口。
#   3. Python 服务的 /metrics 被服务间鉴权挡着，返 401。Prometheus 的 scrape_configs
#      不支持自定义请求头，所以靠把 /metrics 加进 lea_authkit 的 EXEMPT_PATHS 解决
#      （理由和 /health 同构：采集器带不了自定义头）。
#
# ⚠️ lea-gateway 是唯一一个**不走业务端口**的目标（9108 而不是 8080）。它对公网，
# 所以指标单独开了一个不发布到宿主的 listener，详见那个 job 上面的说明。别"顺手
# 统一"成业务端口。
#
# 上线前记得按环境核对一遍：k8s 里的目标应该换成 Service 名或者改用
# kubernetes_sd_configs 自动发现，不要照抄这份 compose 的服务名。

scrape_configs:
  # lea-agent：聊天引擎。metrics 在主端口，不是 8200。
  - job_name: 'lea-agent'
    static_configs:
      - targets: ['agent:8100']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - target_label: service
        replacement: 'lea-agent'

  # lea-config：agent 配置 + 缓存
  - job_name: 'lea-config'
    static_configs:
      - targets: ['config:8500']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - target_label: service
        replacement: 'lea-config'

  # lea-rag：知识库检索 + 文档处理 + 记忆
  - job_name: 'lea-rag'
    static_configs:
      - targets: ['rag:8300']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - target_label: service
        replacement: 'lea-rag'

  # lea-tools：工具执行 + 沙箱 + MCP
  #
  # ⚠️ 它**不在这个 compose 栈里**，按约定部署在远端 10.192.241.137:8400
  # （见 docker-compose.test-server.yml 头部）。所以这里写 IP 而不是服务名。
  #
  # 实测（2026-10-13）这个端口是 connection refused —— 服务当时没在跑。这个 job
  # 会显示 down，那是真实状态，不是配置错。
  - job_name: 'lea-tools'
    static_configs:
      - targets: ['10.192.241.137:8400']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - target_label: service
        replacement: 'lea-tools'

  # lea-gateway：公网入口，所有请求的必经之路
  #
  # ⚠️ 端口是 9108 而**不是**业务端口 8080，这是故意的。
  #
  # 网关是唯一对公网的服务（compose 里 8840:8080 发布到宿主，这台机器有公网 IP）。
  # 在 8080 上放行 /metrics 等于把请求量、各端点错误率、全部端点名、鉴权拒绝次数
  # 公开到互联网 —— 那些正好是侦察一个系统最想要的东西。所以指标走第二个 listener，
  # 9108 **不在 compose 里 publish**，只有同一个 compose 网络里的容器能访问。
  #
  # 也正因为走内网，不需要给 Prometheus 配凭据（scrape_configs 不支持自定义请求头，
  # 只有 Basic/Bearer/mTLS，而网关认的是 RS256 OIDC token，Prometheus 签不出来）。
  #
  # 独有的两个指标（其他服务没有、也只有网关能看到）：
  #   lea_gateway_auth_rejections_total{reason}      鉴权拒绝，reason 只有
  #                                                  missing_token / invalid_token
  #   lea_gateway_tenant_resolve_failures_total      租户归属解析失败（403 主因）
  - job_name: 'lea-gateway'
    static_configs:
      - targets: ['gateway:9108']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - target_label: service
        replacement: 'lea-gateway'

  # lea-agent-worker：Temporal worker，真正跑 agent run 的地方
  #
  # 9109 是 worker 自己起的可观测性端口（跟网关的 9108 错开一位），**不发布到
  # 宿主**，只在 compose 网络内可达。
  #
  # 这里的 temporal_* 指标不是我们埋的，是 Temporal SDK 自带的 —— 在
  # internal/temporalrun/Dial() 里挂了 MetricsHandler 就开始出数。最该看的几条：
  #
  #   temporal_activity_schedule_to_start_latency  活排队多久才被接走。这是判断
  #       **worker 够不够**的首选信号，也是官方推荐的自动扩缩依据。
  #   temporal_workflow_task_schedule_to_start_latency  同上，workflow 侧。
  #   temporal_activity_execution_failed  / temporal_workflow_task_execution_failed
  #       失败计数，带 failure_reason（6 个固定取值）。
  #   temporal_poll_no_task  poller 空转。连不上 Temporal 时这条会变化，比健康
  #       检查更早反映问题（/health 刻意不 ping Temporal，见 compose 里的注释）。
  #
  # 注意 lea_agent_* 那批（HTTP、LLM、工具调用）在这个端口上**基本没有数** ——
  # 它们是 cmd/server 的埋点，worker 不走那条路。别把两边的指标混着查。
  - job_name: 'lea-agent-worker'
    static_configs:
      - targets: ['agent-worker:9109']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - target_label: service
        replacement: 'lea-agent-worker'

  # ── 下面这个服务没有配 job，因为它压根没有指标端点（实测 2026-10-13）────────
  #
  # 不配**永远 down 的目标**是有意的：那种目标会训练人忽略告警面板，比没有更糟。
  # 等补上埋点之后再把 job 加回来。
  #
  #   lea-parser      /metrics 返 404（带不带内部 token 都一样）。

  # Prometheus 自己。自监控很便宜，而且"采集器是不是还活着"这个问题得有人答。
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Redis / MySQL 需要各自的 exporter，现在没部署。要加的话起
  # oliver006/redis_exporter 和 prom/mysqld-exporter，然后把下面两段打开。
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
  #
  # - job_name: 'mysql'
  #   static_configs:
  #     - targets: ['mysql-exporter:9104']
