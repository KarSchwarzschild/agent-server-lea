services:
  gateway:
    build:
      context: ..
      dockerfile: packages/lea-gateway/Dockerfile
    container_name: lea-gateway
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    depends_on:
      - agent
      - config
      - rag
      - tools
    restart: unless-stopped

  agent:
    build:
      context: ..
      dockerfile: packages/lea-agent/Dockerfile
      # agentloop 是本仓库之外的兄弟仓库，go.mod 里 replace 指向它（见 Dockerfile 头部）。
      # 少了这行，buildkit 会把 `agentloop` 当成 Docker Hub 上的镜像去拉，报的是
      # "failed to solve: agentloop: ... failed size validation" —— 完全看不出是缺上下文。
      additional_contexts:
        agentloop: ../../agentloop
    image: lea-agent:dev
    container_name: lea-agent
    env_file:
      - ../.env
    environment:
      LEA_AGENT_EXECUTION_MODE: temporal
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      LEA_AGENT_TEMPORAL_TASK_QUEUE: lea-agent-runs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: unless-stopped

  agent-worker:
    image: lea-agent:dev
    container_name: lea-agent-worker
    entrypoint: ["/usr/local/bin/lea-agent-worker"]
    healthcheck:
      disable: true
    env_file:
      - ../.env
    environment:
      LEA_AGENT_EXECUTION_MODE: temporal
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      LEA_AGENT_TEMPORAL_TASK_QUEUE: lea-agent-runs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: unless-stopped

  temporal:
    image: temporalio/temporal@sha256:ad4c82c97bd12b417d1ea942610dbcd511afb250c4d5ed26c694009533df447e
    container_name: lea-temporal
    # start-dev 的 SQLite 文件位于 named volume；本地开发栈用 root 初始化该卷。
    user: "0:0"
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --db-filename
      - /var/lib/temporal/temporal.db
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal_data:/var/lib/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  config:
    build:
      context: ..
      dockerfile: packages/lea-config/Dockerfile
    container_name: lea-config
    env_file:
      - ../.env
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  rag:
    build:
      context: ..
      dockerfile: packages/lea-rag/Dockerfile
    container_name: lea-rag
    env_file:
      - ../.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  tools:
    build:
      context: ..
      dockerfile: packages/lea-tools/Dockerfile
    container_name: lea-tools
    env_file:
      - ../.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: lea-minio
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: lea-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: lea-dev-password
      MYSQL_DATABASE: lea-platform-test
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lea-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  minio_data:
  temporal_data:
