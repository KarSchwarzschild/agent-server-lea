[project]
name = "lea-platform"
version = "0.1.0"
description = "终身教育AI Agent平台"
requires-python = ">=3.11"
dependencies = [
    "lea-agent",
    "lea-rag",
    "lea-config",
    "lea-tools",
    "lea-authkit",
]

[tool.uv.sources]
lea-agent = { workspace = true }
lea-rag = { workspace = true }
lea-config = { workspace = true }
lea-tools = { workspace = true }
lea-authkit = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/lea-agent",
    "packages/lea-authkit",
    "packages/lea-config",
    "packages/lea-data",
    "packages/lea-parser",
    "packages/lea-rag",
    "packages/lea-tools",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# workspace 成员由 uv 装成 editable，本来就 import 得到，所以这里只列**需要额外
# 补路径**的。加 lea-tools / lea-config 是多余的（试过，加不加结果一样）。
pythonpath = ["packages/lea-rag/src", "packages/lea-config/src", "packages/lea-tools/src", "packages/lea-authkit/src", "packages/lea-parser/src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
