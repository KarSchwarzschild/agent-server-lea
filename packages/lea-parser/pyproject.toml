[project]
name = "lea-parser"
version = "0.1.0"
description = "LEA 文件处理服务 — 解析/分块/鉴权/限流/计费"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "python-jose[cryptography]>=3.3",
    "redis>=5.0",
    "httpx>=0.27",
    "structlog>=24.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
    "python-pptx>=0.6",
    "PyMuPDF>=1.24",
    "langchain-text-splitters>=0.2",
    "boto3>=1.34",
    "lea-authkit",
    "prometheus-client>=0.20",
]

[tool.uv.sources]
lea-authkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lea_parser"]
