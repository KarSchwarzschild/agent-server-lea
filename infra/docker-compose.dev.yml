services:
  backend:
    build:
      context: ..
      dockerfile: packages/lea-server/Dockerfile
    container_name: lea-backend-dev
    ports:
      - "8100:8000"  # host:container — 8100 避开 lifelong-edu 的 8000
    env_file:
      - ../.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_PASSWORD: lea-dev-password  # 与 mysql 容器 MYSQL_ROOT_PASSWORD 一致，覆盖 .env
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      LEA_MILVUS_URI: http://milvus:19530
      LEA_EMBEDDING_API_BASE: http://202.205.160.8:8012
      LEA_RERANKER_API_BASE: http://202.205.160.8:6006
      MINERU_URL: http://202.205.160.8:8001
    volumes:
      - ../packages:/app/packages
      - ../pyproject.toml:/app/pyproject.toml
      - ../uv.lock:/app/uv.lock
      - backend_venv:/app/.venv
    command: >
      sh -c "uv sync --frozen --no-dev && uv run uvicorn lea_server.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: lea-mysql-dev
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: lea-dev-password
      MYSQL_DATABASE: lea-platform-test
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack-server:7.4.0-v3
    container_name: lea-redis-dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  celery-worker:
    build:
      context: ..
      dockerfile: packages/lea-server/Dockerfile
    container_name: lea-celery-worker-dev
    env_file:
      - ../.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_PASSWORD: lea-dev-password  # 与 mysql 容器 MYSQL_ROOT_PASSWORD 一致，覆盖 .env
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      LEA_MILVUS_URI: http://milvus:19530
      LEA_EMBEDDING_API_BASE: http://202.205.160.8:8012
      LEA_RERANKER_API_BASE: http://202.205.160.8:6006
      MINERU_URL: http://202.205.160.8:8001
    volumes:
      - ../packages:/app/packages
      - ../pyproject.toml:/app/pyproject.toml
      - ../uv.lock:/app/uv.lock
      - backend_venv:/app/.venv
    command: >
      sh -c "uv sync --frozen --no-dev && uv run celery -A lea_server.tasks.celery_app worker --loglevel=info --pool=solo --concurrency=2"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: lea-minio-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_dev_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: lea-kafka-dev
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: LEA-kafka-dev-cluster-001
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: lea-milvus-etcd-dev
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus_etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 10s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.5.8
    container_name: lea-milvus-dev
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    command: milvus run standalone
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      milvus-etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  mysql_dev_data:
  minio_dev_data:
  milvus_etcd_data:
  milvus_data:
  backend_venv:
