# lea-rag —— 知识库检索 / 记忆 :8300。集群内服务。
#
# 依赖最重（126 个包，含 milvus / embedding 那一套），所以启动最慢、内存要得多。
# 探针的 initialDelay 比另外两个大一截就是这个原因 —— 给小了会在启动期间被反复
# 判死重启，表现为 CrashLoopBackOff，而其实它只是还在加载。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lea-rag
  labels: {app: lea-rag}
spec:
  replicas: 2
  selector:
    matchLabels: {app: lea-rag}
  template:
    metadata:
      labels: {app: lea-rag}
    spec:
      # 私有 registry 必需。用
      #   kubectl create secret docker-registry lea-registry \
      #       --docker-server=<registry> --docker-username=<u> --docker-password=<p>
      # 创建；名字对不上的表现是 Pod 卡在 ImagePullBackOff。
      imagePullSecrets:
        - name: lea-registry
      containers:
        - name: lea-rag
          # ⚠️ 占位符。部署前替换成 registry 地址 + 不可变 tag，例如
          #     swr.<region>.myhuaweicloud.com/<组织>/lea-rag:<commit-sha>
          # **用 commit sha，不要用 latest** —— 用 latest 就回到了"线上跑的是哪个
          # commit 查不出来"那个问题。CI 每次构建都会打 sha tag，见 .gitlab-ci.yml。
          image: lea-rag:REPLACE_ME
          imagePullPolicy: Always
          ports:
            - {name: http, containerPort: 8300}
          envFrom:
            - configMapRef: {name: lea-common}
            - secretRef: {name: lea-secrets}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "2", memory: 3Gi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: lea-rag
spec:
  type: ClusterIP
  selector: {app: lea-rag}
  ports:
    - {name: http, port: 8300, targetPort: http}
