# nginx — scale-test 栈的 agent 路由（infra/docker-compose.scale-test.yml）。
#
# 按 session_id 做一致性哈希：同一 session 永远落到同一副本，保证 SSE 和中断恢复正常。
# 这是 Temporal 模式下的正确生产路由策略，不能用轮询。
#
# 指纹自愈测试：停掉 agent-1，流量重新哈希到 agent-2，触发从 DB 重建路径。

map $uri $session_key {
    # 从路径里提取 session_id（/api/sessions/<id>/...）
    ~^/api/sessions/([^/]+) $1;
    # 其他路径（建会话、列会话等）按 remote_addr 分散，无所谓落哪个副本
    default $remote_addr;
}

upstream lea_agent {
    hash $session_key consistent;
    # max_fails=1 fail_timeout=3s：第一次连接失败就把这个节点从哈希环上摘掉，
    # 3 秒后探一次看它是否恢复。默认值是 1 次 / 10s，10s 窗口太长。
    server agent-1:8100 max_fails=1 fail_timeout=3s;
    server agent-2:8100 max_fails=1 fail_timeout=3s;
}

log_format upstream '$remote_addr [$time_local] "$request" $status '
                    'upstream=$upstream_addr session=$session_key '
                    'rt=$request_time urt=$upstream_response_time';

server {
    listen 8100;
    server_name _;

    access_log /var/log/nginx/access.log upstream;

    location / {
        proxy_pass http://lea_agent;
        # 连接失败或超时时立刻重试另一个副本（最多再试 1 次）。
        # 注意：SSE 一旦开始流式输出就无法在半路 retry，这里只覆盖初始连接阶段。
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
