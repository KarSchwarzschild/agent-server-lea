services:
  gateway:
    build:
      context: ..
      dockerfile: packages/lea-gateway/Dockerfile
    container_name: lea-gateway
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    depends_on:
      - agent
      - config
      - rag
      - tools
    restart: unless-stopped

  agent:
    build:
      context: ..
      dockerfile: packages/lea-agent/Dockerfile
      # agentloop 是本仓库之外的兄弟仓库，go.mod 里 replace 指向它（见 Dockerfile 头部）。
      # 少了这行，buildkit 会把 `agentloop` 当成 Docker Hub 上的镜像去拉，报的是
      # "failed to solve: agentloop: ... failed size validation" —— 完全看不出是缺上下文。
      additional_contexts:
        agentloop: ../../agentloop
    container_name: lea-agent
    env_file:
      - ../.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  config:
    build:
      context: ..
      dockerfile: packages/lea-config/Dockerfile
    container_name: lea-config
    env_file:
      - ../.env
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  rag:
    build:
      context: ..
      dockerfile: packages/lea-rag/Dockerfile
    container_name: lea-rag
    env_file:
      - ../.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  tools:
    build:
      context: ..
      dockerfile: packages/lea-tools/Dockerfile
    container_name: lea-tools
    env_file:
      - ../.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: lea-minio
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: lea-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: lea-dev-password
      MYSQL_DATABASE: lea-platform-test
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lea-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  minio_data:
