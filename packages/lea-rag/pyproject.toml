[project]
name = "lea-rag"
version = "0.2.0"
description = "LEA 检索服务（KB + Memory）— 独立部署，内部依赖仅 lea-authkit"
requires-python = ">=3.11"
dependencies = [
    "llama-index-core>=0.12",
    "llama-index-vector-stores-milvus>=0.4",
    "llama-index-llms-openai-like>=0.3",
    "llama-index-embeddings-openai>=0.3",
    "pymilvus>=2.5",
    "PyMuPDF>=1.25",
    "tiktoken>=0.8",
    "httpx>=0.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "structlog>=24.0",
    "celery[redis]>=5.4",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.6",
    "boto3>=1.34",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "prometheus-client>=0.20",
    # 服务间鉴权（被调方中间件）。见 packages/lea-authkit。
    "lea-authkit",
]

[tool.uv.sources]
lea-authkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lea_rag"]
