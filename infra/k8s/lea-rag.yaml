# lea-rag —— 知识库检索 / 记忆 :8300。集群内服务。
#
# 依赖最重（126 个包，含 milvus / embedding 那一套），所以启动最慢、内存要得多。
# 探针的 initialDelay 比另外两个大一截就是这个原因 —— 给小了会在启动期间被反复
# 判死重启，表现为 CrashLoopBackOff，而其实它只是还在加载。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lea-rag
  labels: {app: lea-rag}
spec:
  replicas: 2
  selector:
    matchLabels: {app: lea-rag}
  template:
    metadata:
      labels: {app: lea-rag}
    spec:
      containers:
        - name: lea-rag
          image: lea-rag:dev   # 换成 SWR 地址 + 具体 tag
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8300}
          envFrom:
            - configMapRef: {name: lea-common}
            - secretRef: {name: lea-secrets}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "2", memory: 3Gi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: lea-rag
spec:
  type: ClusterIP
  selector: {app: lea-rag}
  ports:
    - {name: http, port: 8300, targetPort: http}
