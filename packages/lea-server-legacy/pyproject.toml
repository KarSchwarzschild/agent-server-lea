[project]
name = "lea-server-legacy"
version = "0.1.0"
description = "LEGACY: retired LEA FastAPI monolith/service layer"
requires-python = ">=3.11"
dependencies = [
    "lea-graph-legacy",
    "lea-apps-legacy",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0",
    "celery[redis]>=5.4",
    "kafka-python-ng>=2.0",
    "flower>=2.0",
    "boto3>=1.34",
]

[tool.uv.sources]
lea-graph-legacy = { workspace = true }
lea-apps-legacy = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lea_server"]
