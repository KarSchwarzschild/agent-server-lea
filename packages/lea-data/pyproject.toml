[project]
name = "lea-data"
version = "0.1.0"
description = "LEA observability, logging, evaluation, and feedback-loop data pipeline"
requires-python = ">=3.11"
dependencies = [
    "lea-rag",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "structlog>=24.0",
]

[tool.uv.sources]
lea-rag = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lea_data"]
