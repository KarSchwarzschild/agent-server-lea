[project]
name = "lea-apps-legacy"
version = "0.1.0"
description = "LEGACY: retired plugin-style app framework from the old lea-server/lea-graph stack"
requires-python = ">=3.11"
dependencies = [
    "lea-rag",
    "langchain-text-splitters>=0.3",
    "python-docx>=1.1",
    "python-pptx>=1.0",
]

[tool.uv.sources]
lea-rag = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lea_apps"]
