# nginx —— lea-agent 前面的反向代理。
#
# 这份是验证台用的（infra/docker-compose.verify.yml），但里面的 proxy 参数跟 CCE 上
# Ingress 要配的是同一套，所以它也是那边的参照。
#
# ⚠️ 别看 infra/nginx/default.conf —— 那份把 /api/ 指向 lea-backend:8000（已经退出
# 调用链的 lea-server），而且挂的前端目录 ../frontend/dist 都不存在了。

upstream lea_agent {
    # **故意用轮询，不做会话亲和。**
    #
    # 这正是要验证的东西：跨副本停止、断线续传、生成中打断都不该依赖"同一个用户
    # 总是落到同一个副本"。加了 ip_hash 的话这些路径根本不会被走到 —— 测试全绿，
    # 而真上了多副本（或者副本重启导致哈希重映射）就炸。
    #
    # 顺便说明为什么亲和路由本来也救不了：session_id 在 stop 请求的 URL 里，
    # 但在 POST /chat/stream 的**请求体**里，nginx 读不了请求体，没法让两者哈希到
    # 同一个后端。
    server agent-a:8100;
    server agent-b:8100;
}

# 日志里必须带 upstream_addr。默认格式不带，于是"这个请求落到哪个副本"完全看不出来
# —— 而验证多副本行为时，这恰恰是唯一重要的信息。排查线上问题时同样需要。
log_format upstream '$remote_addr [$time_local] "$request" $status '
                    'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log upstream;

    # SSE 的四件套。少任何一个的表现都是"流式变成一次性吐出"或者"连接莫名断掉"，
    # 而且都不报错。
    location /api/ {
        proxy_pass http://lea_agent;
        proxy_http_version 1.1;

        # 1. 不缓冲。默认 nginx 会攒够一块才转发，于是用户等半分钟然后整段回答
        #    一次性出现 —— 后端明明在逐 token 推。这是最容易漏、也最像"模型很慢"
        #    的一条。
        proxy_buffering off;
        proxy_cache off;

        # 2. 读超时要大于最长的一轮生成。默认 60s，长任务（PPT、报告）跑到一半
        #    就被 nginx 掐断，客户端看到的是流突然结束，没有 done 事件。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # 3. 别关 chunked。SSE 是流式的，没有 Content-Length。
        chunked_transfer_encoding on;

        # 4. Connection 头置空 —— 上游是 HTTP/1.1 长连接，转发 "close" 会让
        #    keepalive 失效。注意不能照抄 WebSocket 那套 Upgrade 写法，SSE 不升级协议。
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /health 不走 upstream —— 这里是 nginx 自己的存活，不是后端的。
    # 排空中的 lea-agent 会故意让 /health 返 503（让负载均衡摘掉自己），
    # 混在一起的话分不清"nginx 挂了"和"某个后端在优雅退出"。
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
