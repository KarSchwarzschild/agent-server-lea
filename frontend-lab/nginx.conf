# lea-frontend-lab 的 Nginx 配置。
#
# 反代目标用 compose 服务名 gateway:8080 —— 这个容器跟 gateway 在同一个
# compose 网络里（见 infra/docker-compose.test-server.yml），走内部 DNS，
# 不需要走公网端口 8840。
#
# 路径清单照抄 vite.config.ts 里 dev server 的 proxy 表，两边必须保持一致：
# 那份决定了"开发时哪些路径转发给后端"，这份决定了"生产环境同一批路径转发给
# 谁"。新增一个后端路径两边都要加，漏了这里的话本地能跑、部署上是 404 ——
# 跟网关那边"路由白名单"是同一类坑（见 lea-gateway/main.go 的说明）。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # proxy_pass 里写字面主机名时，nginx 只在**启动时**解析一次 DNS 并永久缓存。
    # gateway 容器重建换了 IP 之后这里还攥着旧地址，表现是所有 API 502
    # (connect refused) 而静态页面照常 200 —— 2026-10-19 真踩了：lab 缓存着
    # 192.168.48.12、console 缓存 .11，而 gateway 已经漂到 .13（补网关指标那几天
    # 重建过两次）。两个前端容器跑了快一周没动，谁都没发现。
    #
    # 上游写成变量会强制 nginx 在每次请求时走 resolver 重新解析，valid 限制缓存
    # 时长。代价是 proxy_pass 用变量后 nginx 不再自动拼接匹配到的 URI，所以必须
    # 显式带 $request_uri —— 原样转发，和原来的字面量写法等价。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway_upstream "http://gateway:8080";

    # SSE（/chat、/super-agent）和长轮询都不能被 Nginx 默认的响应缓冲卡住，
    # 否则前端会等不到流式片段，看起来像是后端不返回。
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location /api/ {
        proxy_pass $gateway_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass $gateway_upstream$request_uri;
    }

    location /chat {
        proxy_pass $gateway_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /super-agent {
        proxy_pass $gateway_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /knowledge-bases {
        proxy_pass $gateway_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /kb {
        proxy_pass $gateway_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /admin {
        proxy_pass $gateway_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /tools {
        proxy_pass $gateway_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /parse {
        proxy_pass $gateway_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA：任何没匹配上面 API 路径、也没对应静态文件的请求都回退到 index.html，
    # 让前端路由自己接管，否则刷新非首页路径会直接 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
