# Nginx 反向代理 + 限流
# 使用方法：docker-compose -f docker-compose.yml -f docker-compose.nginx.yml up

version: '3.8'

services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/lea-platform.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - lea-agent
      - lea-config
      - lea-rag
      - lea-tools
    restart: always
    networks:
      - lea-network

networks:
  lea-network:
    external: true
