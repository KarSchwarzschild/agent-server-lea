# lea-gateway —— 公网唯一入口：验外部 JWT 后按路径转发给业务服务。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lea-gateway
  labels: {app: lea-gateway}
spec:
  replicas: 2
  selector:
    matchLabels: {app: lea-gateway}
  template:
    metadata:
      labels: {app: lea-gateway}
    spec:
      containers:
        - name: lea-gateway
          image: lea-gateway:dev
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: lea-common}
            - secretRef: {name: lea-secrets}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: lea-gateway
spec:
  type: ClusterIP
  selector: {app: lea-gateway}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lea-gateway
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  rules:
    - host: CHANGE-ME.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: lea-gateway
                port: {name: http}
