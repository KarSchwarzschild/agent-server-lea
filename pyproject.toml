[project]
name = "lea-platform"
version = "0.1.0"
description = "终身教育AI Agent平台"
requires-python = ">=3.11"
dependencies = [
    "lea-agent",
    "lea-rag",
    "lea-config",
    "lea-tools",
    "lea-authkit",
]

[tool.uv.sources]
lea-agent = { workspace = true }
lea-rag = { workspace = true }
lea-config = { workspace = true }
lea-tools = { workspace = true }
lea-authkit = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/lea-agent",
    "packages/lea-authkit",
    "packages/lea-config",
    "packages/lea-data",
    "packages/lea-parser",
    "packages/lea-rag",
    "packages/lea-tools",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# ⚠️ 只写 "tests" 的话**包内测试永远不跑** —— 而且不报错、不警告，全量回归照常绿。
# 发现它是因为给 admin_mcp 的 sync 补了四条测试，单文件跑 27 passed、全量跑 249 passed，
# 两个数字对不上：那 27 条一条都没进去。
#
# 漏掉的不是边角料：lea-tools/tests 里是传输白名单（stdio 关死）、凭证不进缓存、
# sync 幂等与归属继承 —— 全是安全行为。「有测试」和「测试会跑」是两件事，中间只隔
# 这一行配置。
#
# 逐个列**文件**而不是目录，因为 lea-tools/tests 里混着三类东西，后两类不能进默认回归：
#
#   单元测试        下面这四个，纯内存 + monkeypatch
#   起服务的集成    test_full_chain.py（subprocess 拉三个服务）、test_e2e.py（uvicorn 线程）
#   评测脚本        test_artifact_identify.py（有 __main__ 和 --llm 参数，要 API key）
#
# 后两类混进来的表现不是"失败"，而是**整个 pytest 崩在 collection 阶段**
# （capture 的 "I/O operation on closed file"）外加超时被 kill —— 一个测试都收不到，
# 比失败更难认。同理别写 testpaths = ["."]：那还会去收 packages/*-legacy 和 .venv。
testpaths = [
    "tests",
    "packages/lea-tools/tests/test_mcp_p0.py",
    "packages/lea-tools/tests/test_url_guard.py",
    "packages/lea-tools/tests/test_internal_mcp.py",
    "packages/lea-tools/tests/test_file_tools.py",
    "packages/lea-tools/tests/test_sandbox_adopt.py",
    "packages/lea-tools/tests/test_tool_tenant_isolation.py",
    # 名字叫 e2e 但纯内存（不起服务、不出网），10 passed。跟上面那两个真 e2e 只是撞名。
    "packages/lea-parser/tests/test_e2e.py",
]
# workspace 成员由 uv 装成 editable，本来就 import 得到，所以这里只列**需要额外
# 补路径**的。加 lea-tools / lea-config 是多余的（试过，加不加结果一样）。
#
# 后两个是**归档包**，跟着 *-legacy 改名一起从 workspace 里摘出去了。它们的依赖
# 还装着，所以只要补回路径，老测试照常能跑 —— tests/ 下有 4 个文件还 import
# lea_server / lea_graph（conftest 的几个 fixture 也是），不补的话是 22 个
# collection ERROR。
#
# ⚠️ 这两行跟 packages/*-legacy 同生共死：哪天真删掉那三个归档包，这两行和那 4 个
# 测试文件要一起走，别让它们变成指向空目录的死路径。
pythonpath = [
    "packages/lea-rag/src",
    "packages/lea-config/src",
    "packages/lea-tools/src",
    "packages/lea-authkit/src",
    "packages/lea-parser/src",
    "packages/lea-server-legacy/src",
    "packages/lea-graph-legacy/src",
]

[tool.ruff]
target-version = "py311"
line-length = 120
# 上游 skill 包不是我们的源码：anthropic-pptx / anthropic-xlsx / skill-creator 是
# 整包投放进沙箱的 bundle 载荷，改了它们在下次同步上游时会被覆盖掉。按我们的风格
# 规范去 lint 别人的代码，只会产生永远修不完、也不该修的噪声。
#
# 三个 legacy 包同理，但原因不同：它们已经不在任何 compose / k8s 里跑了
# （infra/k8s/README.md 明确写着"不要再作为运行服务接入"，alerts.yml 把
# lea-apps-legacy 称作"归档代码"）。给不部署的代码改风格，是拿改动风险换零收益
# ——而且这些包的测试覆盖远不如在跑的服务，改坏了也不一定有人发现。
exclude = [
    "packages/lea-tools/skills",
    "packages/lea-server-legacy",
    "packages/lea-apps-legacy",
    "packages/lea-graph-legacy",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    # UP042：不把 `class X(str, Enum)` 换成 `StrEnum`。两者的 str() 语义不同——
    # (str, Enum) 的 str(X.A) 是 "X.A"，StrEnum 是 "a"。排除 legacy 之后还剩 6 个
    # （lea-data 的 FeedbackType，lea-rag 的 PaperSource/PaperType/Strategy/
    # RetrievalStrategy/RouteMode），都流向 API schema 和 DB 取值，换掉是拿序列化
    # 行为换一个纯风格收益。(str, Enum) 本身是完全合法、能正常工作的写法。
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# E402：这些脚本/测试必须先执行再 import，顺序是功能性的，不是风格问题：
#   - scripts/*：`sys.stdout.reconfigure(encoding="utf-8")` 要在任何可能打印的
#     模块被 import 之前跑掉，否则 Windows 控制台输出中文直接炸（见 CLAUDE.md）。
#   - tests/test_integration.py：要先设 DB_HOST/JWT_SECRET 等环境变量、再往
#     sys.path 插三个 package 的 src 目录，然后才能 import 被测模块。
# 把 import 挪到顶部会让这些文件真的坏掉，所以按目录豁免，不逐行加 noqa。
"scripts/*.py" = ["E402"]
"tests/test_integration.py" = ["E402"]
"packages/lea-tools/tests/test_e2e.py" = ["E402"]
# 三个服务入口里的 router import 紧贴着对应的 include_router 调用，是刻意的
# "import 挨着用处写"：17 组 import/注册一一对应，挪到文件顶部会把这个对应关系
# 拆到 20 行开外。已确认 api 子模块没有 import 回 server（无循环依赖），所以这
# 纯粹是排版约定，不是功能需要——但也没有理由为了消一条风格规则去改动在跑的入口。
"packages/lea-config/src/lea_config/server.py" = ["E402"]
"packages/lea-tools/src/lea_tools/server.py" = ["E402"]
"packages/lea-parser/src/lea_parser/server.py" = ["E402"]
# E501：这个文件里有一段整体发给模型的提示词（LLM_PROMPT），断行位置属于内容。
# 超长那行结束在三引号字符串内部，行尾挂不上 noqa，所以在这里整文件豁免。
"packages/lea-tools/tests/test_artifact_identify.py" = ["E501"]
