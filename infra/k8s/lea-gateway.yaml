# lea-gateway —— 公网唯一入口：验外部 JWT 后按路径转发给业务服务。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lea-gateway
  labels: {app: lea-gateway}
spec:
  replicas: 2
  selector:
    matchLabels: {app: lea-gateway}
  template:
    metadata:
      labels: {app: lea-gateway}
    spec:
      # 私有 registry 必需。用
      #   kubectl create secret docker-registry lea-registry \
      #       --docker-server=<registry> --docker-username=<u> --docker-password=<p>
      # 创建；名字对不上的表现是 Pod 卡在 ImagePullBackOff。
      imagePullSecrets:
        - name: lea-registry
      containers:
        - name: lea-gateway
          # ⚠️ 占位符。部署前替换成 registry 地址 + 不可变 tag，例如
          #     swr.<region>.myhuaweicloud.com/<组织>/lea-gateway:<commit-sha>
          # **用 commit sha，不要用 latest** —— 用 latest 就回到了"线上跑的是哪个
          # commit 查不出来"那个问题。CI 每次构建都会打 sha tag，见 .gitlab-ci.yml。
          image: lea-gateway:REPLACE_ME
          imagePullPolicy: Always
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: lea-common}
            - secretRef: {name: lea-secrets}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: lea-gateway
spec:
  type: ClusterIP
  selector: {app: lea-gateway}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lea-gateway
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  rules:
    - host: CHANGE-ME.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: lea-gateway
                port: {name: http}
