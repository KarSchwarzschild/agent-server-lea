# 验证台专用的 nginx 主配置。**生产不要用这份。**
#
# 存在的唯一理由是下面那行 worker_processes 1 —— 它是这个验证台能用的前提，
# 详细原因见 docker-compose.verify.yml 里 nginx 那一段，摘要：
#
# nginx 默认轮询的状态是每个 worker 各持一份（fork 后的独立拷贝）。auto 在这台
# 机器上是 34 个 worker，低流量下每个请求基本落在不同 worker 上，每个都从第一个
# peer 开始数 —— 实测 40 个并发请求 36 个去了 agent-a。于是跨副本的那几条路径
# 人工验证时根本走不到，测出来的绿是假的。
#
# 压成 1 个 worker 之后轮询严格交替。
#
# 本来想用 `nginx -g "worker_processes 1;"` 省掉这个文件，但那会跟镜像自带
# nginx.conf 里的 worker_processes auto 冲突，报 "directive is duplicate" 直接起不来。

worker_processes 1;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 具体的 server / upstream 在 conf.d/default.conf（挂的是 lea-agent.conf）
    include /etc/nginx/conf.d/*.conf;
}
