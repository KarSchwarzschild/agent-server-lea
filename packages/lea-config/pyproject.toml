[project]
name = "lea-config"
version = "0.1.0"
description = "LEA 配置管理服务 — Agent/Skill/Tool/Team/KB CRUD"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "structlog>=24.0",
    "python-multipart>=0.0.9",
    "boto3>=1.35",
    "pyyaml>=6.0",
    # 服务间鉴权（被调方中间件）。见 packages/lea-authkit。
    "lea-authkit",
]

[tool.uv.sources]
lea-authkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lea_config"]
